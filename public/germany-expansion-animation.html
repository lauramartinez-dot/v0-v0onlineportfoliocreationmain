  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Germany — Global Expansion<\u002Ftitle>\n\n\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body {\n    background: #fff;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    min-height: 100vh;\n  }\n  .stage {\n    position: relative;\n    width: 780px;\n    height: 780px;\n  }\n  .globe-img {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    opacity: 0.32;\n  }\n  .overlay {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n  }\n\n  /* Origin pulse rings */\n  @keyframes pulse {\n    0%   { r: 7;  stroke-opacity: 0.55; }\n    100% { r: 42; stroke-opacity: 0; }\n  }\n  .pulse-ring {\n    fill: none;\n    stroke: #6b1969;\n    stroke-width: 1.3;\n    animation: pulse 2.4s cubic-bezier(0.15, 0.5, 0.4, 1) infinite;\n  }\n  .pulse-ring-2 { animation-delay: -1.2s; }\n  .pulse-ring-3 { animation-delay: -0.6s; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"stage\">\n  <img class=\"globe-img\" id=\"globe\" src=\"78f758e6-d3e3-4f2d-a808-c30b675ecbe6\" alt=\"\">\n\n  <svg class=\"overlay\" viewBox=\"0 0 780 780\" xmlns=\"http://www.w3.org/2000/svg\">\n    <defs>\n      <!-- Soft glow filter for arcs -->\n      <filter id=\"glow-sm\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\">\n        <feGaussianBlur stdDeviation=\"1.8\" result=\"b\"><\u002FfeGaussianBlur>\n        <feMerge><feMergeNode in=\"b\"><\u002FfeMergeNode><feMergeNode in=\"SourceGraphic\"><\u002FfeMergeNode><\u002FfeMerge>\n      <\u002Ffilter>\n      <!-- Stronger glow for dots -->\n      <filter id=\"glow-lg\" x=\"-120%\" y=\"-120%\" width=\"340%\" height=\"340%\">\n        <feGaussianBlur stdDeviation=\"5\" result=\"b\"><\u002FfeGaussianBlur>\n        <feMerge><feMergeNode in=\"b\"><\u002FfeMergeNode><feMergeNode in=\"SourceGraphic\"><\u002FfeMergeNode><\u002FfeMerge>\n      <\u002Ffilter>\n      <!-- Origin glow -->\n      <filter id=\"glow-orig\" x=\"-80%\" y=\"-80%\" width=\"260%\" height=\"260%\">\n        <feGaussianBlur stdDeviation=\"4\" result=\"b\"><\u002FfeGaussianBlur>\n        <feMerge><feMergeNode in=\"b\"><\u002FfeMergeNode><feMergeNode in=\"SourceGraphic\"><\u002FfeMergeNode><\u002FfeMerge>\n      <\u002Ffilter>\n    <\u002Fdefs>\n\n    <!-- ── ORIGIN ── -->\n    <circle class=\"pulse-ring\" cx=\"388\" cy=\"391\" r=\"7\"><\u002Fcircle>\n    <circle class=\"pulse-ring pulse-ring-2\" cx=\"388\" cy=\"391\" r=\"7\"><\u002Fcircle>\n    <circle class=\"pulse-ring pulse-ring-3\" cx=\"388\" cy=\"391\" r=\"7\"><\u002Fcircle>\n    <!-- Halo -->\n    <circle cx=\"388\" cy=\"391\" r=\"14\" fill=\"#6b1969\" opacity=\"0.18\" filter=\"url(#glow-orig)\"><\u002Fcircle>\n    <!-- Core dot -->\n    <circle cx=\"388\" cy=\"391\" r=\"6\" fill=\"#6b1969\" filter=\"url(#glow-sm)\"><\u002Fcircle>\n    <circle cx=\"388\" cy=\"391\" r=\"2.2\" fill=\"rgba(255,255,255,0.9)\"><\u002Fcircle>\n\n    <!--\n      Arc paths — all same start point (Germany).\n      Each path length determines travel speed; all start simultaneously.\n      The JS sets strokeDasharray=length and animates dashoffset from length→0\n      at a constant speed so ALL arcs depart together and arrive proportionally.\n    -->\n\n    <!-- UK -->\n    <path id=\"a1\" d=\"M388,391 Q362,355 332,359\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"2.2\" stroke-linecap=\"round\" filter=\"url(#glow-sm)\" opacity=\"0\"><\u002Fpath>\n    <!-- USA -->\n    <path id=\"a2\" d=\"M388,391 Q265,252 107,378\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"2.2\" stroke-linecap=\"round\" filter=\"url(#glow-sm)\" opacity=\"0\"><\u002Fpath>\n    <!-- India -->\n    <path id=\"a3\" d=\"M388,391 Q468,332 516,437\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"2.2\" stroke-linecap=\"round\" filter=\"url(#glow-sm)\" opacity=\"0\"><\u002Fpath>\n    <!-- Brazil -->\n    <path id=\"a4\" d=\"M388,391 Q338,478 293,534\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"2.2\" stroke-linecap=\"round\" filter=\"url(#glow-sm)\" opacity=\"0\"><\u002Fpath>\n    <!-- Japan -->\n    <path id=\"a5\" d=\"M388,391 Q530,272 644,339\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"2.2\" stroke-linecap=\"round\" filter=\"url(#glow-sm)\" opacity=\"0\"><\u002Fpath>\n\n    <!-- ── DESTINATION BLOOMS ── -->\n    <!-- Each: outer ring + core dot + white centre. All start invisible. -->\n\n    <!-- UK bloom -->\n    <circle id=\"br1\" cx=\"332\" cy=\"359\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"1.2\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"br1b\" cx=\"332\" cy=\"359\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"0.7\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"bd1\" cx=\"332\" cy=\"359\" r=\"0\" fill=\"#6b1969\" opacity=\"0\" filter=\"url(#glow-lg)\"><\u002Fcircle>\n    <circle id=\"bc1\" cx=\"332\" cy=\"359\" r=\"0\" fill=\"white\" opacity=\"0\"><\u002Fcircle>\n\n    <!-- USA bloom -->\n    <circle id=\"br2\" cx=\"107\" cy=\"378\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"1.2\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"br2b\" cx=\"107\" cy=\"378\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"0.7\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"bd2\" cx=\"107\" cy=\"378\" r=\"0\" fill=\"#6b1969\" opacity=\"0\" filter=\"url(#glow-lg)\"><\u002Fcircle>\n    <circle id=\"bc2\" cx=\"107\" cy=\"378\" r=\"0\" fill=\"white\" opacity=\"0\"><\u002Fcircle>\n\n    <!-- India bloom -->\n    <circle id=\"br3\" cx=\"516\" cy=\"437\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"1.2\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"br3b\" cx=\"516\" cy=\"437\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"0.7\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"bd3\" cx=\"516\" cy=\"437\" r=\"0\" fill=\"#6b1969\" opacity=\"0\" filter=\"url(#glow-lg)\"><\u002Fcircle>\n    <circle id=\"bc3\" cx=\"516\" cy=\"437\" r=\"0\" fill=\"white\" opacity=\"0\"><\u002Fcircle>\n\n    <!-- Brazil bloom -->\n    <circle id=\"br4\" cx=\"293\" cy=\"534\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"1.2\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"br4b\" cx=\"293\" cy=\"534\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"0.7\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"bd4\" cx=\"293\" cy=\"534\" r=\"0\" fill=\"#6b1969\" opacity=\"0\" filter=\"url(#glow-lg)\"><\u002Fcircle>\n    <circle id=\"bc4\" cx=\"293\" cy=\"534\" r=\"0\" fill=\"white\" opacity=\"0\"><\u002Fcircle>\n\n    <!-- Japan bloom -->\n    <circle id=\"br5\" cx=\"644\" cy=\"339\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"1.2\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"br5b\" cx=\"644\" cy=\"339\" r=\"0\" fill=\"none\" stroke=\"#6b1969\" stroke-width=\"0.7\" opacity=\"0\"><\u002Fcircle>\n    <circle id=\"bd5\" cx=\"644\" cy=\"339\" r=\"0\" fill=\"#6b1969\" opacity=\"0\" filter=\"url(#glow-lg)\"><\u002Fcircle>\n    <circle id=\"bc5\" cx=\"644\" cy=\"339\" r=\"0\" fill=\"white\" opacity=\"0\"><\u002Fcircle>\n\n  <\u002Fsvg>\n<\u002Fdiv>\n\n<script>\n  const lerp  = (a,b,t) => a+(b-a)*t;\n  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));\n  const eio   = t => t<0.5 ? 2*t*t : -1+(4-2*t)*t;\n  const eout  = t => 1-Math.pow(1-t,3);\n  const eout5 = t => 1-Math.pow(1-t,5);\n\n  // Gather arc paths and their lengths\n  const arcEls = [1,2,3,4,5].map(n => {\n    const el  = document.getElementById('a'+n);\n    const len = el.getTotalLength();\n    el.style.strokeDasharray  = len;\n    el.style.strokeDashoffset = len;\n    return { el, len };\n  });\n\n  // Travel speed: constant px/ms so all depart together, arrive at own time\n  const SPEED   = 0.30;   // px per ms\n  const DURS    = arcEls.map(a => a.len / SPEED);\n  const MAX_DUR = Math.max(...DURS);\n\n  const PRE     = 400;    // pause before arcs start\n  const HOLD    = 2000;   // hold all arcs complete\n  const FADE    = 700;    // fade everything out\n  const LOOP    = PRE + MAX_DUR + HOLD + FADE + 300;\n\n  let T0 = null, lastEl = 0;\n\n  function setBloom(i, bloomT, globalA) {\n    const b   = eout5(bloomT);\n    const n   = i+1;\n    // Inner ring: expands quickly\n    const r1  = lerp(0, 20, eout(bloomT));\n    const a1  = lerp(0.75, 0, bloomT) * globalA;\n    const br  = document.getElementById('br'+n);\n    br.setAttribute('r', r1); br.style.opacity = a1;\n\n    // Outer ring: expands slower, more delayed\n    if (bloomT > 0.25) {\n      const b2 = (bloomT-0.25)/0.75;\n      const r2 = lerp(0, 30, eout(b2));\n      const a2 = lerp(0.45, 0, b2) * globalA;\n      const br2 = document.getElementById('br'+n+'b');\n      br2.setAttribute('r', r2); br2.style.opacity = a2;\n    }\n\n    // Core dot\n    const bd = document.getElementById('bd'+n);\n    bd.setAttribute('r', lerp(0, 5.5, b)); bd.style.opacity = b * globalA;\n\n    // White pinpoint\n    const bc = document.getElementById('bc'+n);\n    bc.setAttribute('r', lerp(0, 2.2, b)); bc.style.opacity = b * globalA * 0.85;\n  }\n\n  function resetBloom(i) {\n    const n = i+1;\n    ['br','br'+n+'b','bd','bc'].forEach(id => {});\n    ['br'+n,'br'+n+'b','bd'+n,'bc'+n].forEach(id => {\n      const el = document.getElementById(id);\n      if (el) { el.setAttribute('r',0); el.style.opacity=0; }\n    });\n  }\n\n  function reset() {\n    arcEls.forEach(({el,len},i) => {\n      el.style.strokeDashoffset = len;\n      el.style.opacity = 0;\n      resetBloom(i);\n    });\n  }\n\n  function tick(ts) {\n    if (!T0) T0 = ts;\n    const elapsed = (ts - T0) % LOOP;\n    if (elapsed < lastEl) reset();\n    lastEl = elapsed;\n\n    // Global fade out\n    const fadeStart = PRE + MAX_DUR + HOLD;\n    const globalA   = elapsed > fadeStart\n      ? clamp(1 - (elapsed-fadeStart)/FADE, 0, 1)\n      : 1;\n\n    arcEls.forEach(({el,len},i) => {\n      const arcEl = elapsed - PRE;\n      const t     = arcEl < 0 ? 0 : clamp(arcEl / DURS[i], 0, 1);\n      const e     = eio(t);\n\n      el.style.strokeDashoffset = len * (1-e);\n      el.style.opacity = Math.min(t/0.025, 1) * globalA;\n\n      // Bloom starts when arc is 88% done\n      const bloomT = clamp((t-0.88)/0.12, 0, 1);\n      if (bloomT > 0) setBloom(i, bloomT, globalA);\n    });\n\n    requestAnimationFrame(tick);\n  }\n\n  // Use both rAF and a visibility check to keep animation running\n  requestAnimationFrame(tick);\n\n  // Restart rAF if page becomes visible again\n  document.addEventListener('visibilitychange', () => {\n    if (!document.hidden) {\n      T0 = null; lastEl = 0;\n      reset();\n      requestAnimationFrame(tick);\n    }\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
